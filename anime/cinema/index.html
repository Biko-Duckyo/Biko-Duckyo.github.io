<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>追番影院 · 鸭喵屋</title><link rel="stylesheet" href="./cinema.css"></head><body>
<a class="skip" href="#library">跳至动漫列表</a>
<header><a class="brand" href="/anime/" id="brand"><span class="monogram">S<small>R</small></span><span>SCREEN ROOM<small>私人追番影院</small></span></a><nav aria-label="影院导航" hidden><button id="all" aria-pressed="true">全部动漫</button><button id="watching" aria-pressed="false">还在看 <span></span></button><button id="tools" aria-expanded="false">搜索 / 筛选</button></nav></header>
<main><canvas id="stage" tabindex="0" role="application" aria-label="动漫球面海报墙：拖动浏览，方向键移动，回车打开动漫，双指收拢回到球体"></canvas><section id="intro" aria-label="胶片开场"><div class="intro-copy"><p>私人追番影院</p><h1>一卷胶片，<br>一场好故事。</h1><p>一格胶片，连起整个动漫世界。</p></div><div class="intro-controls"><span id="phase">正在读取追番库</span><button id="pause" disabled>暂停播放</button><button id="replay" disabled>重新播放</button><button id="enter" disabled>直接看番库 ↗</button></div></section>
<aside id="panel" hidden aria-label="搜索与筛选动漫"><div class="panel-heading"><h2>找一部动漫</h2><button id="close-panel" aria-label="关闭搜索与筛选">×</button></div><input id="search" type="search" placeholder="搜索动漫、题材或制作方" aria-label="搜索影院动漫"><div class="modes" aria-label="展示方式"><button id="wall-mode" aria-pressed="true">片墙</button><button id="list-mode" aria-pressed="false">列表</button></div><div class="filters" id="status-filters" role="group" aria-label="观看状态"><button data-status="all" aria-pressed="true">全部动漫</button><button data-status="watching">还在看</button><button data-status="completed">已看完</button></div><div class="filters" id="genres" role="group" aria-label="动漫题材"></div><button id="about">关于影院 ↗</button></aside>
<section id="library" hidden aria-label="动漫列表"></section><div id="empty" hidden><h2>没有匹配的动漫</h2><p>换个关键词或筛选条件试试。</p><button id="reset">查看全部动漫</button></div><p id="loading" role="status">正在等待已解锁的追番库…</p><div class="wall-footer" id="wall-footer" hidden><span>↕↔　拖动浏览 · 双指收拢回到球体 <small id="count"></small></span><button id="center">回到中央 ↗</button></div></main>
<dialog id="detail" aria-labelledby="detail-title"><button class="close" id="close-detail" aria-label="关闭动漫详情">×</button><div class="detail-layout"><div class="poster"><img id="poster" alt=""></div><div class="detail-copy"><p id="detail-meta"></p><h2 id="detail-title"></h2><p id="original"></p><dl><div><dt>制作</dt><dd id="studio"></dd></div><div><dt>年代</dt><dd id="year"></dd></div></dl><p id="summary"></p><p id="progress"></p><button class="primary" id="edit">查看 / 编辑追番 ↗</button><small>状态、进度与原追番库共用；不会另建片单。</small></div></div></dialog>
<dialog id="about-dialog" aria-labelledby="about-title"><button class="close" id="close-about" aria-label="关闭影院说明">×</button><p>SCREEN ROOM</p><h2 id="about-title">留一面墙，给动漫。</h2><p>球面片墙、胶片开场与拖动浏览按参考项目的外观和交互独立实现。全部条目来自当前已解锁的追番库。</p><p>在详情中选择「查看 / 编辑追番」，即可回到原入口调整状态和集数，继续使用原有多设备同步。</p><a href="./NOTICE.md" target="_blank" rel="noopener">查看界面与依赖说明 ↗</a></dialog><p id="notice" role="status" aria-live="polite"></p><script type="module" src="./cinema.js?v=20261116-unique-1"></script></body></html>
