<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相册 · Biko</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;color:#e9edf3;
    background:linear-gradient(135deg,#1a2230 0%,#26324a 55%,#32405e 100%);
  }
  .gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;}
  .panel{
    width:min(92vw,480px);padding:clamp(30px,6vw,46px);text-align:center;
    border:1px solid rgba(157,180,211,.28);border-radius:26px;
    background:rgba(20,27,40,.72);
    box-shadow:0 30px 90px rgba(6,10,18,.55);
    -webkit-backdrop-filter:blur(20px) saturate(120%);backdrop-filter:blur(20px) saturate(120%);
  }
  .eyebrow{
    margin:0 0 12px;letter-spacing:.22em;font-size:.74rem;font-weight:750;color:#9db4d3;text-transform:uppercase;
  }
  h1{margin:0;color:#fff;font-size:clamp(1.55rem,5vw,2.2rem);line-height:1.35;}
  .hint{margin:14px auto 24px;color:rgba(233,237,243,.72);font-size:.92rem;line-height:1.75;}
  form{display:grid;gap:12px;}
  input{
    width:100%;height:50px;border:1px solid rgba(157,180,211,.3);border-radius:14px;outline:none;
    background:rgba(255,255,255,.07);color:#fff;font:inherit;text-align:center;
    transition:border-color .2s ease,box-shadow .2s ease;
    caret-color:#9db4d3;
  }
  input::placeholder{color:rgba(233,237,243,.42);}
  input:focus{border-color:rgba(157,180,211,.85);box-shadow:0 0 0 4px rgba(126,150,184,.18);}
  input:disabled{opacity:.6;}
  /* 用 text + 文本遮蔽替代 type=password，避开浏览器密码管理器的自动填充劫持 */
  input.masked{-webkit-text-security:disc;text-security:disc;}
  button.submit{
    height:50px;border:0;border-radius:14px;font:inherit;font-weight:750;color:#fff;cursor:pointer;
    background:linear-gradient(120deg,#7e96b8,#9db4d3);box-shadow:0 12px 30px rgba(126,150,184,.32);
  }
  button.submit:disabled{cursor:wait;opacity:.7;}
  .err{min-height:1.4em;margin:2px 0 0;color:#b9c8e0;font-size:.88rem;}
  .back{display:inline-block;margin-top:16px;color:rgba(233,237,243,.66);font-size:.86rem;text-decoration:none;}
  .back:hover{color:#fff;}
  .panel.shake{animation:gateShake .36s ease;}
  @keyframes gateShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
</style>
</head>

<script>
(function(){
  var ITER=600000, SESSION='biko-gallery-session';
  var token=document.getElementById('bk-data').textContent.trim();
  var passInput=document.getElementById('pass'), okBtn=document.getElementById('ok'),
      errEl=document.getElementById('err'), panel=document.getElementById('panel');

  function b64ToBytes(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function render(html){
    var doc=new DOMParser().parseFromString(html,'text/html');
    var newTitle=doc.title;
    function moveAll(src,dst){Array.prototype.slice.call(src.childNodes).forEach(function(n){dst.appendChild(document.adoptNode(n));});}
    moveAll(doc.head,document.head);
    document.body.replaceChildren();
    moveAll(doc.body,document.body);
    document.title=newTitle;
    Array.prototype.slice.call(document.querySelectorAll('script')).forEach(function(old){
      var s=document.createElement('script');
      if(old.src){s.src=old.src;} else {s.textContent=old.textContent;}
      old.parentNode.replaceChild(s,old);
    });
  }

  // 本次会话已解锁：直接渲染
  try{var cached=sessionStorage.getItem(SESSION); if(cached){render(cached);return;}}catch(e){}

  async function deriveKey(pass,salt){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
  }
  async function decrypt(pass){
    var meta=JSON.parse(new TextDecoder().decode(b64ToBytes(token)));
    var salt=b64ToBytes(meta.salt), iv=b64ToBytes(meta.iv);
    var key=await deriveKey(pass,salt);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,b64ToBytes(meta.ct));
    return new TextDecoder().decode(plain);
  }
  function fail(msg){
    errEl.textContent=msg;
    panel.classList.remove('shake'); void panel.offsetWidth; panel.classList.add('shake');
    passInput.select();
  }
  document.getElementById('form').addEventListener('submit',async function(e){
    e.preventDefault();
    okBtn.disabled=true; errEl.textContent='';
    try{
      var html=await decrypt(passInput.value);
      try{sessionStorage.setItem(SESSION,html);}catch(_){}
      render(html);
    }catch(err){
      if(err&&(err.name==='OperationError'||/padding|tag|decrypt/i.test(err.name||''))){fail('暗号不对哦，再想想~');}
      else{fail('暂时无法校验，请刷新后重试。');}
      okBtn.disabled=false;
    }
  });
  // 输入法（拼音等）候选未上屏时回车，不要当成提交
  passInput.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&(e.isComposing||e.keyCode===229)){e.preventDefault();}
  });
  // 自动填充/浏览器残留可能塞入脏值，进页面先清干净再聚焦
  function resetInput(){
    if(passInput.value && !passInput.dataset.touched){passInput.value='';}
    passInput.focus();
  }
  passInput.addEventListener('input',function(){passInput.dataset.touched='1';});
  window.addEventListener('pageshow',function(){setTimeout(resetInput,50);});
  setTimeout(resetInput,60);
})();
</script>
