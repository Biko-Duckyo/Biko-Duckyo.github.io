<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="ax" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker>
  </defs>
  <rect x="8" y="8" width="804" height="414" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- 左：T1 纵向恢复 -->
  <text x="210" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">T1 纵向弛豫（自旋-晶格）：Mz 恢复</text>
  <line x1="70" y1="320" x2="370" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="70" y1="320" x2="70" y2="80" stroke="#334155" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="378" y="324" font-size="13" fill="#334155">t</text>
  <text x="62" y="84" text-anchor="end" font-size="13" fill="#334155">Mz</text>
  <!-- 平衡值虚线 M0 -->
  <line x1="70" y1="118" x2="370" y2="118" stroke="#94a3b8" stroke-dasharray="5 5"/>
  <text x="366" y="112" text-anchor="end" font-size="12" fill="#94a3b8">平衡 M₀</text>
  <!-- 恢复曲线 0->63%(T1)->渐近 -->
  <path d="M70,320 C120,210 160,155 200,140 C250,122 310,118 365,118" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <!-- T1=63% 点：y=118+(320-118)*0.37=192.8 -->
  <line x1="200" y1="193" x2="200" y2="320" stroke="#16a34a" stroke-dasharray="4 4"/>
  <line x1="70" y1="193" x2="200" y2="193" stroke="#16a34a" stroke-dasharray="4 4"/>
  <circle cx="200" cy="193" r="4.5" fill="#16a34a"/>
  <text x="200" y="338" text-anchor="middle" font-size="13" fill="#16a34a">T1</text>
  <text x="82" y="189" font-size="12" fill="#16a34a">63% M₀</text>
  <text x="210" y="378" text-anchor="middle" font-size="12" fill="#64748b">与环境交换能量；恢复时间取决于样品与条件</text>

  <!-- 分隔 -->
  <line x1="410" y1="58" x2="410" y2="404" stroke="#cbd5e1" stroke-dasharray="6 6"/>

  <!-- 右：T2 横向衰减 -->
  <text x="610" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#0891b2">T2 横向弛豫（自旋-自旋）：Mxy 衰减</text>
  <line x1="470" y1="320" x2="770" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="470" y1="320" x2="470" y2="80" stroke="#334155" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="778" y="324" font-size="13" fill="#334155">t</text>
  <text x="462" y="84" text-anchor="end" font-size="13" fill="#334155">Mxy</text>
  <!-- 初始值 M0 虚线 -->
  <line x1="470" y1="118" x2="770" y2="118" stroke="#94a3b8" stroke-dasharray="5 5"/>
  <text x="766" y="112" text-anchor="end" font-size="12" fill="#94a3b8">初始 M₀</text>
  <!-- 衰减曲线：起点118, T2点37% => y=118+(320-118)*0.63=245.4 -->
  <path d="M470,118 C520,175 560,225 600,245 C650,268 710,288 765,296" fill="none" stroke="#0891b2" stroke-width="2.5"/>
  <line x1="600" y1="245" x2="600" y2="320" stroke="#0891b2" stroke-dasharray="4 4"/>
  <line x1="470" y1="245" x2="600" y2="245" stroke="#0891b2" stroke-dasharray="4 4"/>
  <circle cx="600" cy="245" r="4.5" fill="#0891b2"/>
  <text x="600" y="338" text-anchor="middle" font-size="13" fill="#0891b2">T2</text>
  <text x="482" y="241" font-size="12" fill="#0891b2">37% M₀</text>
  <text x="610" y="378" text-anchor="middle" font-size="12" fill="#64748b">横向相干衰减；图示采用理想单指数模型</text>
</svg>
