<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker>
  </defs>
  <rect x="8" y="8" width="804" height="414" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">自旋回波 SE 时序：90° 激发 → 180° 重聚 → 回波峰值（TE）</text>

  <!-- RF 轨 -->
  <text x="46" y="135" font-size="13" fill="#64748b">RF</text>
  <line x1="80" y1="130" x2="762" y2="130" stroke="#cbd5e1"/>
  <rect x="132" y="104" width="16" height="52" fill="#2563eb"/>
  <text x="140" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">90°</text>
  <rect x="322" y="94" width="16" height="72" fill="#d97706"/>
  <text x="330" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">180°</text>
  <rect x="652" y="104" width="16" height="52" fill="#2563eb"/>
  <text x="660" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">90°</text>

  <!-- 信号轨 -->
  <text x="46" y="285" font-size="13" fill="#64748b">信号</text>
  <line x1="80" y1="285" x2="762" y2="285" stroke="#e2e8f0"/>
  <!-- 失相-重聚回波包络 -->
  <path d="M148,285 C220,300 280,316 322,318 C338,316 400,258 520,238 C580,250 625,286 650,296" fill="none" stroke="#0891b2" stroke-width="2.5"/>
  <circle cx="520" cy="238" r="4.5" fill="#0891b2"/>
  <text x="520" y="226" text-anchor="middle" font-size="12" fill="#0891b2">回波峰值</text>
  <text x="230" y="338" text-anchor="middle" font-size="11" fill="#94a3b8">相位离散（失相）</text>
  <text x="430" y="300" text-anchor="middle" font-size="11" fill="#94a3b8">相位重聚</text>

  <!-- TE / TR 双向时间箭头 -->
  <line x1="140" y1="364" x2="520" y2="364" stroke="#334155" marker-start="url(#a3)" marker-end="url(#a3)"/>
  <text x="330" y="360" text-anchor="middle" font-size="13" fill="#334155">TE（90° → 回波峰）</text>
  <line x1="140" y1="396" x2="660" y2="396" stroke="#334155" marker-start="url(#a3)" marker-end="url(#a3)"/>
  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#334155">TR（相邻两次 90° 脉冲间隔）</text>
</svg>
