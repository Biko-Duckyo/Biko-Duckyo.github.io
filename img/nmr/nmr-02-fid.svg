<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="ax2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker>
  </defs>
  <rect x="8" y="8" width="804" height="414" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">自由感应衰减 FID：理想 90° 脉冲后的示意信号</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="215" x2="762" y2="215" stroke="#334155" stroke-width="1.5" marker-end="url(#ax2)"/>
  <line x1="80" y1="330" x2="80" y2="95" stroke="#334155" stroke-width="1.5" marker-end="url(#ax2)"/>
  <text x="770" y="219" font-size="13" fill="#334155">t</text>
  <text x="72" y="100" text-anchor="end" font-size="13" fill="#334155">信号</text>

  <!-- 指数包络（虚线） -->
  <path d="M80,120 C220,150 360,195 755,211" fill="none" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <path d="M80,310 C220,280 360,235 755,219" fill="none" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="250" y="146" font-size="12" fill="#94a3b8">单指数包络示意</text>

  <!-- 振荡信号折线（幅度沿包络收缩） -->
  <polyline fill="none" stroke="#2563eb" stroke-width="2"
    points="80,215 103,128 126,302 149,146 172,284 195,161 218,269 241,173 264,257 287,183 310,247 333,191 356,239 379,197 402,233 425,202 448,228 471,206 494,224 517,209 540,221 563,211 586,219 609,213 632,217 655,214 678,216 701,215 724,215 747,215"/>

  <!-- 初始幅度标注 -->
  <line x1="80" y1="120" x2="80" y2="310" stroke="#d97706" stroke-width="1.5" marker-start="url(#ax2)" marker-end="url(#ax2)"/>
  <text x="92" y="118" font-size="12" fill="#d97706">初始幅度 M₀</text>

  <!-- 结论注记 -->
  <text x="410" y="368" text-anchor="middle" font-size="13" fill="#475569">图示为理想单频情形；实际 FID 可含多频、拍频和非单指数衰减</text>
  <text x="410" y="392" text-anchor="middle" font-size="12" fill="#94a3b8">T2* 通常不大于 T2；自旋回波可重聚部分静态频率失相（见 03 篇）</text>
</svg>
