<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="8" y="8" width="804" height="414" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <!-- 分栏标题 -->
  <text x="215" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">① 理想孤立 ¹H：B₀ = 0</text>
  <text x="605" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">② 施加静磁场 B₀（塞曼分裂 → M₀）</text>
  <line x1="410" y1="58" x2="410" y2="404" stroke="#cbd5e1" stroke-dasharray="6 6"/>

  <!-- 左栏：随机取向 -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="215" y1="150" x2="215" y2="118" marker-end="url(#arr)"/>
    <line x1="175" y1="175" x2="150" y2="152" marker-end="url(#arr)"/>
    <line x1="255" y1="175" x2="282" y2="153" marker-end="url(#arr)"/>
    <line x1="165" y1="225" x2="136" y2="236" marker-end="url(#arr)"/>
    <line x1="265" y1="225" x2="294" y2="237" marker-end="url(#arr)"/>
    <line x1="185" y1="275" x2="168" y2="306" marker-end="url(#arr)"/>
    <line x1="245" y1="275" x2="264" y2="306" marker-end="url(#arr)"/>
    <line x1="215" y1="235" x2="215" y2="268" marker-end="url(#arr)"/>
  </g>
  <text x="215" y="350" text-anchor="middle" font-size="14" fill="#475569">热平衡平均净磁化为零（简化示意）</text>
  <text x="215" y="374" text-anchor="middle" font-size="14" fill="#475569">此图仅讨论常规热平衡 ¹H 模型</text>

  <!-- 右栏：能级轴 -->
  <line x1="500" y1="95" x2="500" y2="330" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="492" y="92" text-anchor="end" font-size="13" fill="#64748b">+Z</text>
  <text x="500" y="348" text-anchor="middle" font-size="13" fill="#64748b">热平衡态</text>
  <!-- 高能级 β -->
  <line x1="535" y1="150" x2="690" y2="150" stroke="#dc2626" stroke-width="2"/>
  <g stroke="#dc2626" stroke-width="2" fill="none">
    <line x1="560" y1="168" x2="560" y2="140" marker-end="url(#arrR)"/>
    <line x1="610" y1="168" x2="610" y2="140" marker-end="url(#arrR)"/>
  </g>
  <text x="700" y="146" font-size="13" fill="#dc2626">高能态 β（反平行，略少）</text>
  <!-- 低能级 α -->
  <line x1="535" y1="290" x2="690" y2="290" stroke="#16a34a" stroke-width="2"/>
  <g stroke="#16a34a" stroke-width="2" fill="none">
    <line x1="555" y1="272" x2="555" y2="304" marker-end="url(#arrG)"/>
    <line x1="600" y1="272" x2="600" y2="304" marker-end="url(#arrG)"/>
    <line x1="645" y1="272" x2="645" y2="304" marker-end="url(#arrG)"/>
  </g>
  <text x="700" y="294" font-size="13" fill="#16a34a">低能态 α（平行，略多）</text>
  <!-- 能级差 ΔE -->
  <line x1="522" y1="150" x2="522" y2="290" stroke="#d97706" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="514" y="224" text-anchor="end" font-size="13" fill="#d97706">ΔE</text>

  <!-- 合成 M0 大箭头 -->
  <line x1="765" y1="325" x2="765" y2="120" stroke="#2563eb" stroke-width="6" marker-end="url(#arrB)"/>
  <text x="765" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">M₀</text>
  <text x="765" y="376" text-anchor="middle" font-size="12" fill="#2563eb">沿 +Z 的宏观磁化</text>
</svg>
