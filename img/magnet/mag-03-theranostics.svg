<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="g03" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker>
  </defs>
  <rect x="8" y="8" width="804" height="414" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">磁流体热疗 MFH 与诊疗一体化闭环</text>

  <!-- 闭环五节点 -->
  <g font-size="12" text-anchor="middle">
    <rect x="24" y="80" width="140" height="70" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="94" y="108" fill="#1d4ed8" font-weight="700">① 诊断定位</text>
    <text x="94" y="130" fill="#475569">MRI / MPI / PAI</text>
    <text x="94" y="146" fill="#94a3b8">分布信息需模型与校准</text>

    <rect x="184" y="80" width="140" height="70" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="254" y="108" fill="#6d28d9" font-weight="700">② 靶向富集</text>
    <text x="254" y="130" fill="#475569">长循环 + 配体</text>
    <text x="254" y="146" fill="#94a3b8">叶酸受体等主动靶向</text>

    <rect x="344" y="80" width="140" height="70" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="414" y="108" fill="#b91c1c" font-weight="700">③ 治疗执行</text>
    <text x="414" y="130" fill="#475569">AMF 交变磁场产热</text>
    <text x="414" y="146" fill="#94a3b8">共载药 / 免疫调节</text>

    <rect x="504" y="80" width="140" height="70" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="574" y="108" fill="#b45309" font-weight="700">④ 疗效再评估</text>
    <text x="574" y="130" fill="#475569">温度场 + 影像变化</text>
    <text x="574" y="146" fill="#94a3b8">标志物反馈</text>

    <rect x="664" y="80" width="132" height="70" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <text x="730" y="108" fill="#15803d" font-weight="700">⑤ 方案迭代</text>
    <text x="730" y="130" fill="#475569">剂量 / 场参优化</text>
    <text x="730" y="146" fill="#94a3b8">闭环回流至①</text>
  </g>
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#g03)">
    <line x1="164" y1="115" x2="182" y2="115"/><line x1="324" y1="115" x2="342" y2="115"/>
    <line x1="484" y1="115" x2="502" y2="115"/><line x1="644" y1="115" x2="662" y2="115"/>
  </g>
  <path d="M730,150 C730,196 94,196 94,152" fill="none" stroke="#94a3b8" stroke-dasharray="5 5" marker-end="url(#g03)"/>

  <!-- 温度两档 -->
  <g font-size="12" text-anchor="middle">
    <rect x="64" y="216" width="330" height="92" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="229" y="242" fill="#b91c1c" font-weight="700" font-size="13">热效应：温度与时间共同评价</text>
    <text x="229" y="266" fill="#475569">关注温度场、暴露与组织终点</text>
    <text x="229" y="288" fill="#475569">需精准定位，避免损伤正常组织</text>

    <rect x="426" y="216" width="330" height="92" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <text x="591" y="242" fill="#15803d" font-weight="700" font-size="13">联合治疗：设置独立对照</text>
    <text x="591" y="266" fill="#475569">分别验证单独与联合处理效果</text>
    <text x="591" y="288" fill="#475569">不能用统一温度阈值保证选择性</text>
  </g>

  <!-- 瓶颈与安全 -->
  <rect x="64" y="330" width="692" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="410" y="354" text-anchor="middle" font-size="13" fill="#334155" font-weight="700">主要瓶颈：RES 肝脾截留 + 肿瘤血管屏障/EPR 限制 → 静脉给药瘤内浓度低</text>
  <text x="410" y="376" text-anchor="middle" font-size="12" fill="#475569">安全与效应需装置、暴露、对象和温度监测共同验证；体外高 SAR 不等于体内疗效或安全保证</text>
</svg>
