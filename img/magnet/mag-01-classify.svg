<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="g01" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker>
  </defs>
  <rect x="8" y="8" width="804" height="414" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">磁响应与有序类型（定性示意，非按 χ 大小硬分类）</text>

  <!-- 弱磁 -->
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="72" width="350" height="120" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="215" y="98" fill="#1d4ed8" font-weight="700" font-size="13">弱磁（χ 小）</text>
    <text x="215" y="124" fill="#475569">抗磁性：通常为弱负响应，需考虑叠加贡献</text>
    <text x="215" y="146" fill="#475569">顺磁性：Curie 关系适用于相应近似</text>
    <text x="215" y="168" fill="#475569">高温区 χ = C/(T−Tp)（Curie-Weiss）</text>
    <text x="215" y="186" fill="#94a3b8">线性关系只适用于相应场强与温度区间</text>
  </g>

  <!-- 强磁 -->
  <g font-size="12" text-anchor="middle">
    <rect x="430" y="72" width="350" height="120" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="605" y="98" fill="#b91c1c" font-weight="700" font-size="13">磁有序类型（不同类型不共用固定 χ 范围）</text>
    <text x="605" y="124" fill="#475569">铁磁性：自发磁化、磁畴；Tc 以上转顺磁；Fe Co Ni Gd</text>
    <text x="605" y="146" fill="#475569">反铁磁性：相邻磁矩反向抵消；TN 处 χ 峰值（Neel）</text>
    <text x="605" y="168" fill="#475569">亚铁磁性：两组反向磁矩大小不等 → Fe₃O₄ 尖晶石</text>
    <text x="605" y="186" fill="#94a3b8">宏观似铁磁，结构近反铁磁；电阻率更高</text>
  </g>

  <!-- 纳米/非晶特殊类型 -->
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="216" width="240" height="128" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <text x="160" y="242" fill="#15803d" font-weight="700" font-size="13">超顺磁性</text>
    <text x="160" y="266" fill="#475569">单畴不等于超顺磁</text>
    <text x="160" y="286" fill="#475569">热翻转时间与测量时间比较</text>
    <text x="160" y="306" fill="#475569">阻塞状态随温度和时间尺度改变</text>
    <text x="160" y="326" fill="#15803d" font-weight="700">无明显磁滞并非单独充分证据</text>

    <rect x="300" y="216" width="240" height="128" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="420" y="242" fill="#6d28d9" font-weight="700" font-size="13">螺旋磁结构 / 散磁性</text>
    <text x="420" y="266" fill="#475569">层间磁矩锥面螺旋旋转</text>
    <text x="420" y="286" fill="#475569">非晶中磁矩分散但仍有序</text>
    <text x="420" y="306" fill="#475569">宏观可借铁磁/反铁磁描述</text>
    <text x="420" y="326" fill="#94a3b8">非共线有序结构集合</text>

    <rect x="560" y="216" width="220" height="128" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="670" y="242" fill="#b45309" font-weight="700" font-size="13">自旋玻璃</text>
    <text x="670" y="266" fill="#475569">阻挫无序 · 冻结温度 Tf</text>
    <text x="670" y="286" fill="#475569">T &lt; Tf：FC 曲线 &gt; ZFC</text>
    <text x="670" y="306" fill="#475569">峰位随交流频率移动</text>
    <text x="670" y="326" fill="#94a3b8">亚稳态集合，与热历史相关</text>
  </g>

  <text x="410" y="378" text-anchor="middle" font-size="13" fill="#475569">工程指标：剩磁、矫顽场、磁能积；均匀磁化椭球可用退磁因子模型，实际几何需单独分析</text>
  <text x="410" y="402" text-anchor="middle" font-size="12" fill="#94a3b8">原子尺度：轨道与自旋贡献；固体中的晶场、轨道淬灭和交换会改变自由离子近似</text>
</svg>
